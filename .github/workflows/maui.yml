name: .NET MAUI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]

jobs:
  Build_Android:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET v10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10"

      - name: Restore NuGet cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install .NET MAUI Workload
        run: dotnet workload install maui

      - name: Build Android App
        run: dotnet build HackerNews.Maui -f net10.0-android

  Build_Windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '11'

      - name: Setup .NET v10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10"

      - name: Restore NuGet cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install .NET MAUI Workload
        run: dotnet workload install maui

      - name: Build Windows App
        run: dotnet build HackerNews.Maui -f net10.0-windows10.0.19041.0

  Run_Tests:
    needs:
      - Build_Android
      - Build_Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET v10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10"

      - name: Restore NuGet cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
